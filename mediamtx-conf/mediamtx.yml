logLevel: info

# Internal REST API — used by watchdog health checks and camera discovery sync.
api: true
apiAddress: 127.0.0.1:9997

# Ports — RTP/RTCP shifted to avoid clash with API gateway on :8000.
rtspAddress:   :8554
rtpAddress:    :8002
rtcpAddress:   :8003
webrtcAddress: :8889
hlsAddress:    :8888

# Disabled protocols — SRT and RTMP not needed.
rtmp: false
srt:  false

# HLS configuration — low-latency for mobile app (LL-HLS).
hls: true
hlsSegmentDuration: 1s
hlsPartDuration:    200ms
hlsSegmentMaxSize:  50MB

paths:
  entrance:
    source: "rtsp://admin:Aurasmart7%2A@10.42.0.86:554/Streaming/Channels/101?transportmode=unicast&profile=Profile_1"
    rtspTransport: tcp
    sourceOnDemand: false
  entrance-sub:
    source: "rtsp://admin:Aurasmart7%2A@10.42.0.86:554/Streaming/Channels/102?transportmode=unicast&profile=Profile_2"
    rtspTransport: tcp
    sourceOnDemand: false
  parking:
    source: "rtsp://admin:Aurasmart7%2A@10.42.0.210:554/Streaming/Channels/101?transportmode=unicast&profile=Profile_1"
    rtspTransport: tcp
    sourceOnDemand: false
  parking-sub:
    source: "rtsp://admin:Aurasmart7%2A@10.42.0.210:554/Streaming/Channels/102?transportmode=unicast&profile=Profile_2"
    rtspTransport: tcp
    sourceOnDemand: false
